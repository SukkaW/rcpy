name: Automatic Publish
on:
  push:
    branches:
      - master
jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          check-latest: true
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - run: pnpm config set --location=global minimumReleaseAge
      - run: pnpm install
      - run: pnpm run build
      - name: Publish
        run: |
          if git log -1 --pretty=%B | grep "^release: [0-9]\+\.[0-9]\+\.[0-9]\+$";
          then
            pnpm publish --provenance --access public
          elif git log -1 --pretty=%B | grep "^release: [0-9]\+\.[0-9]\+\.[0-9]\+";
          then
            pnpm publish --tag next --provenance --access public
          else
            echo "Not a release, skipping publish"
          fi
